<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Booking Demo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
        @import url('styles.css');
    </style>
</head>
<body>
    <h1>🎟️ Ticket Booking Demo</h1>
    <div class="user-info">
        <strong>User ID:</strong><span id="userId"></span>
    </div>
    <div class="form-group">
        <label>Select Seat</label>
        <div id="seats" class="seats"></div>
    </div>
    <button onclick="bookSeat()">Book Seat</button>

    <!-- Payment section -->
    <div id="paymentBox" class="payment-box">
        <h2>💳 Payment</h2>
        <p>Your seat is temporarily held.</p>
        <div id="timer">Time remaining: 30 seconds</div>
        <button onclick="confirmPayment()">Confirm Payment</button>
        <button onclick="cancelPayment()">Cancel Payment</button>
    </div>

    <div id="message"></div>

    <script>
        const eventId = 1;
        // Generate a random user for each browser tab
        const userId =  Math.floor(Math.random() * 9000) + 1000;
        document.getElementById("userId").innerText = userId;

        let selectedSeatId = null;
        let heldSeatId = null;
        let countdownInterval = null;
        let remainingSeconds = 30;
       
        async function loadSeats() {
            try {
                const response = await fetch(`/api/seats/${eventId}`);
                const seats = await response.json();
                const seatsContainer = document.getElementById("seats");

                seatsContainer.innerHTML = "";
                seats.forEach(seat => {
                    const seatElement = document.createElement("div");
                    seatElement.classList.add("seat");
                    if (seat.status === "AVAILABLE") {
                        seatElement.classList.add("available");
                        seatElement.innerText = seat.seat_number;
                        seatElement.onclick = () => {
                            selectSeat(
                                seat.id,
                                seatElement
                            );
                        };
                    }

                    else if (seat.status === "HELD") {
                        seatElement.classList.add("held");
                        seatElement.innerHTML = `${seat.seat_number}<br>Held`;
                    }

                    else if (seat.status === "BOOKED") {
                        seatElement.classList.add("booked");
                        seatElement.innerHTML = `${seat.seat_number}<br>Booked`;
                    }
                    seatsContainer.appendChild(seatElement);
                });
            } catch (error) {
                console.error(error);
            }
        }

        function selectSeat(seatId, element) {
            selectedSeatId = seatId;
            document.querySelectorAll(".seat")
                .forEach(seat => {
                    seat.classList.remove(
                        "selected"
                    );
                });

            element.classList.add("selected");
        }

        async function bookSeat() {
            const message = document.getElementById("message");
            if (!selectedSeatId) {
                message.innerText = "Please select a seat";
                return;
            }
            try {
                const response = await fetch("/api/book", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            userId: userId,
                            eventId: eventId,
                            seatId: selectedSeatId
                        })
                    }
                );

                const result = await response.json();
                if (!response.ok) {
                    message.innerText = `❌ ${result.message}`;
                    await loadSeats();
                    return;
                }
                // Save held seat
                heldSeatId = result.seatId;
                message.innerText = `⏳ ${result.message}`;

                // Show payment box
                document.getElementById("paymentBox").style.display = "block";

                startCountdown();
                await loadSeats();
                selectedSeatId = null;
            } catch (error) {
                console.error(error);
                message.innerText =  "Something went wrong";
            }
        }

        function startCountdown() {
            clearInterval(countdownInterval);
            remainingSeconds = 30;
            updateTimer();
            countdownInterval = setInterval(async () => {
                remainingSeconds--;
                updateTimer();
                if (remainingSeconds <= 0) {
                        clearInterval(countdownInterval);
                        heldSeatId = null;
                        document.getElementById("paymentBox").style.display = "none";
                        document.getElementById("message").innerText =
                            "⏰ Payment time expired. Seat is available again.";
                        await loadSeats();
                    }
                }, 1000);
        }

        function updateTimer() {
            document.getElementById("timer").innerText =
                `Time remaining: ${remainingSeconds} seconds`;
        }

        async function confirmPayment() {
            if (!heldSeatId) {
                return;
            }
            try {
                const response = await fetch("/api/payment-success",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            userId: userId,
                            seatId: heldSeatId
                        })
                    }
                );


                const result = await response.json();
                if (response.ok) {
                    clearInterval(countdownInterval);
                    document.getElementById("paymentBox").style.display = "none";
                    document.getElementById("message").innerText =
                        `✅ ${result.message}`;

                    heldSeatId = null;
                    await loadSeats();
                } else {
                    document.getElementById("message").innerText =
                        `❌ ${result.message}`;
                }
            } catch (error) {
                console.error(error);
                document.getElementById("message").innerText =
                    "Payment failed";
            }
        }

        async function cancelPayment() {
            if (!heldSeatId) {
                return;
            }
            try {
                const response = await fetch("/api/cancel", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            userId: userId,
                            seatId: heldSeatId
                        })
                    }
                );
                const result = await response.json();
                if (response.ok) {
                    clearInterval(countdownInterval);
                    document.getElementById("paymentBox").style.display = "none";
                    document.getElementById("message").innerText =
                        `↩️ ${result.message}`;
                    heldSeatId = null;
                    await loadSeats();
                } else {
                    document.getElementById("message").innerText =
                        `❌ ${result.message}`;
                }
            } catch (error) {
                console.error(error);
                document.getElementById("message").innerText = "Unable to cancel";
            }
        }

        loadSeats();
    </script>
</body>
</html>
